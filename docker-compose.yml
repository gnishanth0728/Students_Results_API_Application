name: student-results

services:
  # Nginx Reverse Proxy
  nginx:
    container_name: nginx-proxy
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend
    networks:
      - app-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_DB: ${DB_NAME:-school}
      POSTGRES_USER: ${DB_USER:-student}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-student123}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-student}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot API
  api:
    container_name: spring-api
    build:
      context: ./student-results-java-api
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-school}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-student}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-student123}
      APP_PUBLIC_IP: ${APP_PUBLIC_IP:-localhost}
      JAVA_TOOL_OPTIONS: "-javaagent:/opt/http-flow-agent.jar=com.example.student"
      HTTP_FLOW_OUTPUT_DIR: /http-flow-output

    volumes:
      - /home/ubuntu/linux_socket_lab/http-flow-observer/agent/target/http-flow-agent-1.0.0.jar:/opt/http-flow-agent.jar:ro
      - /home/ubuntu/linux_socket_lab/http-flow-observer/output:/http-flow-output
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # React Frontend
  frontend:
    container_name: react-frontend
    build:
      context: ./student-results-ui
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
    ports:
      - "5173:5173"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
